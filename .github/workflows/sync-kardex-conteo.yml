name: Sync Kardex — Brilo Conteo Mensual

on:
  schedule:
    # Corre el día 1 de cada mes a las 3:00 AM El Salvador (UTC-6) = 9:00 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      sucursal_id:
        description: 'Sucursal (ej: 3). Vacío = todas las sucursales.'
        required: false
        default: ''
      hasta:
        description: 'Fecha conteo hasta YYYY-MM-DD. Vacío = último día del mes anterior.'
        required: false
        default: ''
      desde:
        description: 'Fecha inicio período YYYY-MM-DD. Vacío = se detecta automáticamente.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Node
        run: npm install

      - name: Crear .env
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE_CONTENT" > .env

      - name: Instalar openfortivpn
        run: sudo apt-get install -y openfortivpn

      - name: Conectar VPN CLIN
        run: |
          sudo openfortivpn ${{ secrets.VPN_HOST }}:${{ secrets.VPN_PORT }} \
            --username="${{ secrets.VPN_USERNAME }}" \
            --password="${{ secrets.VPN_PASSWORD }}" \
            --trusted-cert="${{ secrets.VPN_TRUSTED_CERT }}" \
            --no-routes \
            2>&1 | tee /tmp/vpn.log &
          VPN_PID=$!
          echo "VPN_PID=$VPN_PID" >> $GITHUB_ENV

          for i in $(seq 1 30); do
            if ip addr show ppp0 2>/dev/null | grep -q 'inet '; then
              echo "✓ VPN conectada (${i}s)"; break; fi; sleep 1; done

          if ! ip addr show ppp0 2>/dev/null | grep -q 'inet '; then
            echo "✗ VPN no conectó en 30s"; cat /tmp/vpn.log; exit 1; fi

          for i in $(seq 1 10); do
            if sudo ip route add 10.0.0.0/8 dev ppp0 2>/dev/null; then
              echo "✓ Ruta 10.0.0.0/8 agregada"; break; fi; sleep 1; done

      - name: Sync Kardex Brilo
        run: |
          # Calcular fecha por defecto: último día del mes anterior
          HASTA="${{ github.event.inputs.hasta }}"
          if [ -z "$HASTA" ]; then
            HASTA=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-%d)
          fi
          echo "Período hasta: $HASTA"

          SUCURSALES="${{ github.event.inputs.sucursal_id }}"
          if [ -z "$SUCURSALES" ]; then
            # Todas las sucursales activas mapeadas a Brilo
            SUCURSALES="1 3 7 8 9 10 11"
          fi

          DESDE_ARG=""
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            DESDE_ARG="--desde=${{ github.event.inputs.desde }}"
          fi

          for SUC in $SUCURSALES; do
            echo "─── Sucursal $SUC ───"
            node database/sync_brilo_kardex.js --sucursal=$SUC --hasta=$HASTA $DESDE_ARG || \
              echo "⚠ Error en sucursal $SUC — continúa con las demás"
          done

      - name: Desconectar VPN
        if: always()
        run: |
          sudo kill $VPN_PID 2>/dev/null || sudo pkill openfortivpn || true
          echo "VPN desconectada"
