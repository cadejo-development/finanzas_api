name: Sync Kardex — Brilo Conteo Mensual

on:
  # Schedule automático DESACTIVADO — re-sync de períodos de auditoría solo manual
  workflow_dispatch:
    inputs:
      sucursal_id:
        description: 'Sucursal (ej: 3). Vacío = todas las sucursales.'
        required: false
        default: ''
      hasta:
        description: 'Fecha conteo hasta YYYY-MM-DD. Vacío = último día del mes anterior.'
        required: false
        default: ''
      desde:
        description: 'Fecha inicio período YYYY-MM-DD. Vacío = se detecta automáticamente.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Node
        run: npm install

      - name: Crear .env
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE_CONTENT" > .env

      - name: Instalar openfortivpn
        run: sudo apt-get install -y openfortivpn

      - name: Conectar VPN CLIN
        run: |
          sudo openfortivpn ${{ secrets.VPN_HOST }}:${{ secrets.VPN_PORT }} \
            --username="${{ secrets.VPN_USERNAME }}" \
            --password="${{ secrets.VPN_PASSWORD }}" \
            --trusted-cert="${{ secrets.VPN_TRUSTED_CERT }}" \
            --no-routes \
            2>&1 | tee /tmp/vpn.log &
          VPN_PID=$!
          echo "VPN_PID=$VPN_PID" >> $GITHUB_ENV

          for i in $(seq 1 30); do
            if ip addr show ppp0 2>/dev/null | grep -q 'inet '; then
              echo "✓ VPN conectada (${i}s)"; break; fi; sleep 1; done

          if ! ip addr show ppp0 2>/dev/null | grep -q 'inet '; then
            echo "✗ VPN no conectó en 30s"; cat /tmp/vpn.log; exit 1; fi

          for i in $(seq 1 10); do
            if sudo ip route add 10.0.0.0/8 dev ppp0 2>/dev/null; then
              echo "✓ Ruta 10.0.0.0/8 agregada"; break; fi; sleep 1; done

      - name: Sync Kardex Brilo
        run: |
          SUC_INPUT="${{ github.event.inputs.sucursal_id }}"
          HASTA_INPUT="${{ github.event.inputs.hasta }}"
          DESDE_INPUT="${{ github.event.inputs.desde }}"

          if [ -n "$SUC_INPUT" ]; then
            # ── Modo manual: sucursal específica ──────────────────────────────
            if [ -z "$HASTA_INPUT" ]; then
              HASTA_INPUT=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-%d)
            fi
            DESDE_ARG=""
            if [ -n "$DESDE_INPUT" ]; then DESDE_ARG="--desde=$DESDE_INPUT"; fi
            echo "─── Manual: sucursal $SUC_INPUT hasta=$HASTA_INPUT ───"
            node database/sync_brilo_kardex.js --sucursal=$SUC_INPUT --hasta=$HASTA_INPUT $DESDE_ARG
          else
            # ── Modo automático: leer periodos de database/kardex-periodos.json ──
            echo "Leyendo periodos desde database/kardex-periodos.json …"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('database/kardex-periodos.json'));
              p.forEach(r => console.log(r.sucursal_id + '|' + r.hasta + '|' + (r.movs_hasta ?? '') + '|' + r.desde + '|' + r.bod + ' ' + r.nombre));
            " | while IFS='|' read SUC HASTA MOVS_HASTA DESDE LABEL; do
              echo "─── $LABEL  suc=$SUC  hasta=$HASTA  movs_hasta=$MOVS_HASTA  desde=$DESDE ───"
              MOVS_ARG=""
              if [ -n "$MOVS_HASTA" ]; then MOVS_ARG="--movs-hasta=$MOVS_HASTA"; fi
              node database/sync_brilo_kardex.js --sucursal=$SUC --hasta=$HASTA --desde=$DESDE $MOVS_ARG || \
                echo "⚠ Error en sucursal $SUC — continúa con las demás"
            done
          fi

      - name: Desconectar VPN
        if: always()
        run: |
          sudo kill $VPN_PID 2>/dev/null || sudo pkill openfortivpn || true
          echo "VPN desconectada"
