name: Sync Diario — Materias Primas, Empleados, Ventas, Snapshot y Recetas

on:
  schedule:
    - cron: '0 16 * * *'  # 10:00 AM El Salvador (UTC-6)
  workflow_dispatch:
    inputs:
      scripts:
        description: 'Scripts a ejecutar (all | materias | empleados | ventas | snapshot | recetas)'
        required: false
        default: 'all'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Node
        run: npm install

      - name: Crear .env
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE_CONTENT" > .env

      - name: Instalar openfortivpn
        run: sudo apt-get install -y openfortivpn

      - name: Conectar VPN CLIN
        run: |
          # Desactivar LCP echo para evitar desconexión por "No response to echo-requests"
          echo "lcp-echo-interval 0" | sudo tee -a /etc/ppp/options

          VPN_CONECTADA=false
          BRILO_IP=10.0.4.20

          for attempt in 1 2 3; do
            echo "--- Intento VPN $attempt/3 ---"
            sudo pkill -9 openfortivpn 2>/dev/null || true
            sudo ip route del 10.0.0.0/8 dev ppp0 2>/dev/null || true
            sleep 3

            sudo openfortivpn ${{ secrets.VPN_HOST }}:${{ secrets.VPN_PORT }} \
              --username="${{ secrets.VPN_USERNAME }}" \
              --password="${{ secrets.VPN_PASSWORD }}" \
              --trusted-cert="${{ secrets.VPN_TRUSTED_CERT }}" \
              --no-routes \
              --pppd-accept-remote \
              >> /tmp/vpn.log 2>&1 &
            VPN_PID=$!
            echo "VPN_PID=$VPN_PID" >> $GITHUB_ENV

            # Esperar a que ppp0 tenga IP
            for i in $(seq 1 60); do
              if ip addr show ppp0 2>/dev/null | grep -q 'inet '; then
                echo "✓ ppp0 con IP (${i}s)"
                break
              fi
              sleep 1
            done

            if ! ip addr show ppp0 2>/dev/null | grep -q 'inet '; then
              echo "⚠ Intento $attempt: ppp0 sin IP en 60s"
              continue
            fi

            # Agregar ruta y verificar que el trafico realmente fluye
            sudo ip route add 10.0.0.0/8 dev ppp0 2>/dev/null || true
            echo "✓ Ruta 10.0.0.0/8 agregada"

            if ping -c 3 -W 5 $BRILO_IP > /dev/null 2>&1; then
              echo "✓ VPN OK — trafico verificado a $BRILO_IP (intento $attempt)"
              VPN_CONECTADA=true
              break
            else
              echo "⚠ Intento $attempt: tunel UP pero sin trafico a $BRILO_IP, reintentando..."
            fi
          done

          if [ "$VPN_CONECTADA" != "true" ]; then
            echo "✗ VPN no pasó trafico después de 3 intentos"
            cat /tmp/vpn.log
            exit 1
          fi

      - name: Sync materias primas
        if: ${{ github.event.inputs.scripts == 'all' || github.event.inputs.scripts == 'materias' || github.event_name == 'schedule' }}
        run: node database/sync_materias_primas.js

      - name: Sync empleados
        if: ${{ github.event.inputs.scripts == 'all' || github.event.inputs.scripts == 'empleados' || github.event_name == 'schedule' }}
        run: node database/sync_empleados_to_rds.js

      - name: Sync ventas Santa Elena
        if: ${{ github.event.inputs.scripts == 'all' || github.event.inputs.scripts == 'ventas' || github.event_name == 'schedule' }}
        run: node database/sync_ventas_santa_elena.js

      - name: Sync snapshot Brilo
        if: ${{ github.event.inputs.scripts == 'all' || github.event.inputs.scripts == 'snapshot' || github.event_name == 'schedule' }}
        run: node database/sync_brilo_snapshot.js

      - name: Sync recetas diario
        if: ${{ github.event.inputs.scripts == 'all' || github.event.inputs.scripts == 'recetas' || github.event_name == 'schedule' }}
        run: node database/sync_recetas_diario.js

      - name: Desconectar VPN
        if: always()
        run: |
          sudo kill $VPN_PID 2>/dev/null || sudo pkill openfortivpn || true
          echo "VPN desconectada"
